<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harder Rock Hotel — a rock-themed hotel management dashboard built with React." />
    <meta name="theme-color" content="#0d0c10" />
    <link rel="icon" type="image/svg+xml" href="/harder-rock-hotel-favicon-white.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/harder-rock-hotel-favicon-black.svg" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <title>Harder Rock Hotel</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("harder-rock:theme") || "system";
        const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
